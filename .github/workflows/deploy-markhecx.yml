name: Verify MarkHECX for Vercel

on:
  push:
    branches: [main]
    paths:
      - "markhecx/**"
      - ".github/workflows/deploy-markhecx.yml"
      - "vercel.json"
  pull_request:
    branches: [main]
    paths:
      - "markhecx/**"
      - ".github/workflows/deploy-markhecx.yml"
      - "vercel.json"
  workflow_dispatch:

concurrency:
  group: markhecx-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: markhecx

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: markhecx/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run regression tests
        run: npm run test:regression

      - name: Run matching benchmark
        run: npm run test:matching

      - name: Type-check and bundle the API
        run: npm run backend:build

      - name: Build production application
        run: npm run build

      # Vercel's existing Git integration deploys main automatically.
      # Production credentials remain in Vercel; no Cloudflare deployment is used.
