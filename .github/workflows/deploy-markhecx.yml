name: Deploy MarkHECX

on:
  push:
    branches: [main]
    paths:
      - "markhecx/**"
      - ".github/workflows/deploy-markhecx.yml"
  workflow_dispatch:

concurrency:
  group: markhecx-production
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: markhecx

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      MARKHECX_API_URL: ${{ vars.MARKHECX_API_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: markhecx/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run regression tests
        run: npm run test:regression

      - name: Run matching benchmark
        run: npm run test:matching

      - name: Validate deployment configuration
        run: |
          test -n "$MARKHECX_API_URL" || { echo "Add MARKHECX_API_URL as a GitHub Actions repository variable."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add CLOUDFLARE_API_TOKEN as a GitHub Actions repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions repository secret."; exit 1; }

      - name: Build production application
        run: npm run build:cloudflare

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config dist/server/wrangler.json --name markhecx
